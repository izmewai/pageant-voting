<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Friend Vote Game 2026</title>

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#eaf6fb;
    color:#20323c;
}

button,
input{
    font-family:inherit;
}


/* =========================
   HEADER
========================= */

header{
    background:#ffffff;
    text-align:center;
    padding:35px 20px 28px;
    border-bottom:1px solid #d8e8ee;
}

.logo{
    width:52px;
    height:52px;

    margin:0 auto 12px;

    border-radius:50%;

    background:#dceff7;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
}

header h1{
    font-family:Georgia, serif;

    font-weight:500;

    font-size:30px;

    letter-spacing:2px;

    color:#20323c;
}

header p{
    margin-top:9px;

    font-size:10px;

    letter-spacing:3px;

    color:#829ba6;
}


/* =========================
   MUSIC BUTTON
========================= */

.music-button{

    position:fixed;

    top:18px;

    right:18px;

    width:46px;
    height:46px;

    border:none;

    border-radius:50%;

    background:#31596b;

    color:white;

    font-size:19px;

    cursor:pointer;

    z-index:100;

    box-shadow:
    0 6px 18px
    rgba(0,0,0,.15);

}


/* =========================
   MAIN
========================= */

.container{

    width:92%;

    max-width:1000px;

    margin:auto;

    padding:40px 0 55px;
}


.intro{

    text-align:center;

    margin-bottom:30px;
}


.intro h2{

    font-family:Georgia, serif;

    font-weight:500;

    font-size:25px;
}


.intro p{

    margin-top:8px;

    font-size:11px;

    letter-spacing:1px;

    color:#8097a1;
}


/* =========================
   CONTESTANT GRID
========================= */

.contestants{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(250px,1fr)
    );

    gap:24px;
}


/* =========================
   CARD
========================= */

.card{

    background:#ffffff;

    border-radius:18px;

    overflow:hidden;

    border:1px solid #dcebf1;

    box-shadow:
    0 10px 28px
    rgba(50,90,110,.10);
}


/* =========================
   TOP 1
========================= */

.card.top-one{

    grid-column:1 / -1;

    display:grid;

    grid-template-columns:
    1fr 1fr;

}


/* =========================
   PHOTO
========================= */

.photo-box{

    position:relative;
}


.photo-box img{

    width:100%;

    height:330px;

    object-fit:cover;

    display:block;
}


/* TOP 1 PHOTO BIG */

.top-one .photo-box img{

    height:470px;
}


/* =========================
   RANK NUMBER
========================= */

.rank-number{

    position:absolute;

    bottom:-23px;

    left:20px;

    width:48px;
    height:48px;

    border-radius:50%;

    background:#ffffff;

    border:2px solid #9bc7da;

    display:flex;

    align-items:center;
    justify-content:center;

    font-family:Georgia, serif;

    font-size:20px;

    color:#31596b;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.12);
}


/* TOP 1 RANK */

.top-one .rank-number{

    width:62px;
    height:62px;

    font-size:27px;

    border-color:#6eabc6;
}


/* =========================
   INFO
========================= */

.info{

    padding:40px 22px 25px;
}


.top-one .info{

    display:flex;

    flex-direction:column;

    justify-content:center;

    padding:35px;
}


/* NAME */

.name{

    font-family:Georgia, serif;

    font-size:21px;

    font-weight:500;

    color:#20323c;
}


.top-one .name{

    font-size:32px;
}


/* CITY */

.city{

    margin-top:9px;

    font-size:13px;

    color:#78919d;
}


/* =========================
   POINTS
========================= */

.points{

    margin-top:22px;

    padding:14px 0;

    border-top:1px solid #e8f0f3;

    border-bottom:1px solid #e8f0f3;

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.points small{

    font-size:10px;

    letter-spacing:1px;

    color:#8ba0a9;
}


.points strong{

    font-size:18px;

    color:#31596b;
}


/* =========================
   VOTE BUTTON
========================= */

.vote-btn{

    width:100%;

    margin-top:18px;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#31596b;

    color:white;

    font-size:11px;

    letter-spacing:1.5px;

    cursor:pointer;
}


.vote-btn:active{

    transform:scale(.98);
}


/* =========================
   ADMIN PANEL
========================= */

#adminPanel{

    display:none;

    width:92%;

    max-width:700px;

    margin:
    0 auto
    50px;

    background:white;

    padding:25px;

    border-radius:18px;

    border:1px solid #dcebf1;

    box-shadow:
    0 10px 30px
    rgba(50,90,110,.10);
}


.admin-title{

    text-align:center;

    margin-bottom:20px;
}


.admin-title h2{

    font-family:Georgia, serif;

    font-weight:500;
}


.admin-title p{

    margin-top:7px;

    font-size:11px;

    color:#8298a2;
}


/* INPUT */

.admin-input{

    width:100%;

    padding:14px;

    margin-top:12px;

    border:1px solid #d6e6ed;

    border-radius:9px;

    outline:none;

    background:#fbfdfe;
}


/* FILE INPUT */

.file-input{

    width:100%;

    margin-top:12px;

    padding:12px;

    border:1px dashed #9fc5d4;

    border-radius:9px;

    background:#f6fbfd;
}


/* ADMIN BUTTON */

.add-btn{

    width:100%;

    padding:14px;

    margin-top:15px;

    border:none;

    border-radius:9px;

    background:#31596b;

    color:white;

    font-size:11px;

    letter-spacing:1px;

    cursor:pointer;
}


/* =========================
   ADMIN CONTESTANT LIST
========================= */

.admin-list{

    margin-top:30px;
}


.admin-card{

    padding:18px;

    margin-top:15px;

    border:1px solid #dcebf1;

    border-radius:12px;

    background:#fbfdfe;
}


.admin-card h3{

    font-family:Georgia, serif;

    font-weight:500;

    margin-bottom:10px;
}


.admin-buttons{

    display:flex;

    gap:10px;

    margin-top:12px;
}


.edit-btn,
.delete-btn{

    flex:1;

    padding:10px;

    border:none;

    border-radius:7px;

    cursor:pointer;
}


.edit-btn{

    background:#31596b;

    color:white;
}


.delete-btn{

    background:#eeeeee;

    color:#a33;
}


/* =========================
   FOOTER
========================= */

footer{

    text-align:center;

    padding:35px 20px;

    border-top:1px solid #d7e7ed;
}


.admin-btn{

    background:transparent;

    border:none;

    color:#718d9a;

    font-size:12px;

    letter-spacing:1px;

    cursor:pointer;
}


.footer-text{

    margin-top:15px;

    font-size:9px;

    letter-spacing:2px;

    color:#9db0b9;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    header h1{
        font-size:24px;
    }


    .contestants{
        grid-template-columns:1fr;
    }


    /* TOP 1 MOBILE */

    .card.top-one{

        display:block;

        grid-column:auto;
    }


    /* TOP 1 BIG */

    .top-one .photo-box img{
        height:420px;
    }


    /* NORMAL PHOTO */

    .photo-box img{
        height:330px;
    }


    .top-one .info{

        display:block;

        padding:42px 22px 25px;
    }


    .top-one .name{
        font-size:27px;
    }


    .music-button{

        top:12px;

        right:12px;
    }

}

</style>

</head>


<body>


<!-- =========================
     MUSIC
========================= -->

<audio
id="backgroundMusic"
loop>

    <source
    src="VID_20260906_110914_487.mp4"
    type="audio/mp4">

</audio>



<!-- =========================
     MUSIC BUTTON
========================= -->

<button
class="music-button"
onclick="toggleMusic()"
id="musicButton">

🎵

</button>



<!-- =========================
     HEADER
========================= -->

<header>

<div class="logo">

👑

</div>


<h1>

FRIEND VOTE GAME 2026

</h1>


<p>

ONLINE VOTING

</p>

</header>



<!-- =========================
     MAIN
========================= -->

<div class="container">


<div class="intro">

<h2>

Contestants

</h2>


<p>

VOTE FOR YOUR FAVORITE FRIEND

</p>

</div>



<div
class="contestants"
id="contestants">

</div>


</div>



<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel">


<div class="admin-title">

<h2>

🔐 Admin Panel

</h2>


<p>

Manage Your Contestants

</p>

</div>



<!-- ADD CONTESTANT -->


<input

class="admin-input"

type="text"

id="name"

placeholder="Contestant Name">



<input

class="admin-input"

type="text"

id="city"

placeholder="City Name">



<!-- PHOTO FILE -->


<input

class="file-input"

type="file"

id="imageFile"

accept="image/*">



<button

class="add-btn"

onclick="addContestant()">

➕ ADD NEW CONTESTANT

</button>



<!-- ADMIN LIST -->

<div
class="admin-list"
id="adminList">

</div>


</div>



<!-- =========================
     FOOTER
========================= -->

<footer>


<button

class="admin-btn"

onclick="adminLogin()">

🔐 ADMIN PERMITS

</button>



<div class="footer-text">

FRIEND VOTE GAME 2026

</div>


</footer>



<script>


/* =========================
   DATA
========================= */

let contestants =

JSON.parse(

localStorage.getItem(
"contestants"
)

)

||

[];



/* =========================
   SAVE
========================= */

function saveContestants(){

localStorage.setItem(

"contestants",

JSON.stringify(contestants)

);

}



/* =========================
   RENDER CONTESTANTS
========================= */

function renderContestants(){


/* SORT BY POINTS */

contestants.sort(

function(a,b){

return b.points-a.points;

}

);


let container =

document.getElementById(
"contestants"
);


container.innerHTML="";


contestants.forEach(

function(person,index){


let topClass="";


if(index === 0){

topClass="top-one";

}


/* IMAGE */

let imageSource =

person.image ||

"https://via.placeholder.com/600x800";


container.innerHTML +=

`

<div class="card ${topClass}">


<div class="photo-box">


<img

src="${imageSource}"

alt="${person.name}">


<!-- RANK -->

<div class="rank-number">

${index + 1}

</div>


</div>



<div class="info">


<div class="name">

${person.name}

</div>



<div class="city">

📍 ${person.city}

</div>



<div class="points">


<small>

TOTAL POINTS

</small>


<strong>

${person.points}

POINTS

</strong>


</div>



<button

class="vote-btn"

onclick="vote(${index})">

❤️ VOTE +10 POINTS

</button>


</div>


</div>

`;


}

);


renderAdminList();

}



/* =========================
   VOTE
========================= */

function vote(index){


contestants[index].points += 10;


saveContestants();


renderContestants();

}



/* =========================
   MUSIC
========================= */

function toggleMusic(){


let music =

document.getElementById(
"backgroundMusic"
);


let button =

document.getElementById(
"musicButton"
);


if(music.paused){


music.play();


button.innerHTML="🔊";


}

else{


music.pause();


button.innerHTML="🎵";


}


}



/* =========================
   ADMIN LOGIN
========================= */

function adminLogin(){


let pin = prompt(

"Enter Admin PIN"

);


if(pin === "2013"){


let panel =

document.getElementById(
"adminPanel"
);


panel.style.display="block";


panel.scrollIntoView({

behavior:"smooth"

});


renderAdminList();


}

else{


alert(

"Incorrect PIN!"

);


}


}



/* =========================
   ADD CONTESTANT
========================= */

function addContestant(){


let name =

document.getElementById(
"name"
).value.trim();


let city =

document.getElementById(
"city"
).value.trim();


let file =

document.getElementById(
"imageFile"
).files[0];



if(

name === ""

||

city === ""

){

alert(

"Please enter Name and City!"

);

return;

}



/* IMAGE FILE */

if(file){


let reader = new FileReader();


reader.onload = function(event){


contestants.push({


name:name,


city:city,


points:0,


image:event.target.result


});


saveContestants();


clearAddForm();


renderContestants();


alert(

"Contestant Added!"

);


};


reader.readAsDataURL(file);


}


else{


contestants.push({


name:name,


city:city,


points:0,


image:""


});


saveContestants();


clearAddForm();


renderContestants();


alert(

"Contestant Added!"

);


}


}



/* =========================
   CLEAR FORM
========================= */

function clearAddForm(){


document.getElementById(
"name"
).value="";


document.getElementById(
"city"
).value="";


document.getElementById(
"imageFile"
).value="";


}



/* =========================
   ADMIN LIST
========================= */

function renderAdminList(){


let list =

document.getElementById(
"adminList"
);


if(!list){

return;

}


list.innerHTML="";


contestants.forEach(

function(person,index){


list.innerHTML +=

`

<div class="admin-card">


<h3>

${person.name}

</h3>


<p>

📍 ${person.city}

</p>


<p style="margin-top:6px;">

⭐ ${person.points} Points

</p>



<div class="admin-buttons">


<button

class="edit-btn"

onclick="editContestant(${index})">

✏️ EDIT

</button>



<button

class="delete-btn"

onclick="deleteContestant(${index})">

🗑 DELETE

</button>


</div>


</div>

`;


}

);


}



/* =========================
   EDIT CONTESTANT
========================= */

function editContestant(index){


let person =

contestants[index];



let newName = prompt(

"Contestant Name:",

person.name

);


if(

newName === null

||

newName.trim() === ""

){

return;

}



let newCity = prompt(

"City Name:",

person.city

);


if(

newCity === null

||

newCity.trim() === ""

){

return;

}



let newPoints = prompt(

"Vote Points:",

person.points

);


if(

newPoints === null

||

isNaN(newPoints)

){

return;

}



/* UPDATE */

person.name =

newName.trim();


person.city =

newCity.trim();


person.points =

Number(newPoints);



saveContestants();


renderContestants();


alert(

"Contestant Updated!"

);


}



/* =========================
   DELETE
========================= */

function deleteContestant(index){


let confirmDelete =

confirm(

"Delete this contestant?"

);


if(

confirmDelete

){


contestants.splice(

index,

1

);


saveContestants();


renderContestants();


}


}



/* =========================
   START
========================= */

renderContestants();


</script>


</body>
</html>
